# CPU-only development configuration. This is the baseline MVP path and works
# without /dev/dri, VirGL, VAAPI, NVENC, AMF, or Vulkan.
[vm]
id = "vm42-cpu"
console = 0
qemu_pid_file = "/run/qmdp/vm42-cpu/qemu.pid"

[dbus]
# Keep the bus local to the VM worker. Never expose it over TCP.
address_file = "/run/qmdp/vm42-cpu/dbus.address"
destination = "org.qemu"
socket_mode = "0600"

[sunshine]
instance_name = "vm42-cpu"
config_dir = "/var/lib/qmdp/vm42-cpu/sunshine"
port_base = 48900
capture_backend = "qemu_dbus"
input_backend = "qemu_dbus"
audio_backend = "qemu_dbus"
encoder = "software"

[video]
console = 0
prefer_dmabuf = false
allow_cpu_fallback = true
require_same_gpu = false
max_width = 2560
max_height = 1440
mailbox_depth = 1
pixel_format = "bgra"

[audio]
sample_rate = 48000
channels = 2
max_buffer_ms = 50
overflow_policy = "drop_oldest"
underflow_policy = "silence"

[resize]
policy = "match_on_connect"
debounce_ms = 250
width_alignment = 2
height_alignment = 2

[security]
clipboard = "off"
file_transfer = false
microphone = false
