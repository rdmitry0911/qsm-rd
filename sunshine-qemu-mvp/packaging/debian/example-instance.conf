# Copy to /etc/q-sunshine/instances.d/<VMID>.conf, set the private D-Bus
# address created for that QEMU process, then enable q-sunshine@<VMID>.
# Keep this file root-readable only: the D-Bus socket is the VM capability.
SUNSHINE_QEMU_DBUS_ADDRESS=unix:path=/run/q-sunshine/100/qemu-display1.bus
SUNSHINE_QEMU_DBUS_DESTINATION=org.qemu
SUNSHINE_QEMU_DBUS_RENDER_NODE=/dev/dri/renderD128

# Bind to a protected interface or a VPN address in production.  Each
# Sunshine instance needs its own GameStream base port and network policy.
QSUNSHINE_BIND_ADDRESS=127.0.0.1
QSUNSHINE_PORT=47989
# Leave this unset for Sunshine's own live encoder probe. Set it only after
# validating a real encoder, for example: QSUNSHINE_ENCODER=nvenc
#QSUNSHINE_ENCODER=nvenc

# Optional QSF clipboard, file transfer and guest-resize companion.  Before
# enabling q-sunshine-qsf-control@100, configure QEMU's virtio-serial server
# socket and uncomment this exact path.
#QSUNSHINE_QSF_AGENT_SOCKET=/run/q-sunshine/100/qsf-agent.sock

# Tested per-VM Sunshine encoder envelope. These are operator-validated
# limits, not inferred from /dev/nvidia*, /dev/dri, CPU count, or KVM.
#QSUNSHINE_QSF_HOST_MAX_WIDTH=3840
#QSUNSHINE_QSF_HOST_MAX_HEIGHT=2160
#QSUNSHINE_QSF_HOST_MAX_FPS=60
#QSUNSHINE_QSF_HOST_MAX_BITRATE_KBPS=45000
#QSUNSHINE_QSF_HOST_ENCODER_CODECS=H264,HEVC,AV1
# Optional actual codec-mask query. Only a loopback /serverinfo URL is valid.
#QSUNSHINE_QSF_SUNSHINE_SERVERINFO_URL=http://127.0.0.1:47990/serverinfo

# Optional retained CLI/test QSF mTLS gateway. Generate separate certificate
# material for every VM and keep all paths root-readable only. The Qt desktop
# UI is ticket-only and does not expose client certificate/key fields.
#QSUNSHINE_QSF_SERVER_CERT=/etc/q-sunshine/tls/100/server.crt
#QSUNSHINE_QSF_SERVER_KEY=/etc/q-sunshine/tls/100/server.key
#QSUNSHINE_QSF_CLIENT_CA=/etc/q-sunshine/tls/100/client-ca.crt
#QSUNSHINE_QSF_GATEWAY_HOST=127.0.0.1
#QSUNSHINE_QSF_GATEWAY_PORT=48122
#QSUNSHINE_QSF_MAX_CONCURRENT_REQUESTS=16

# Optional TLS 1.3 / PAM system authentication for a q-sunshine-aware Qt
# client. All values are per VM; allowed users are mandatory when enabling
# q-sunshine-auth@<VMID>.  Provision a root-owned mode-0600 raw 32-byte key
# and server TLS material first. See installed SYSTEM_AUTH.md.
#QSUNSHINE_AUTH_SERVER_CERT=/etc/q-sunshine/auth/100/server.crt
#QSUNSHINE_AUTH_SERVER_KEY=/etc/q-sunshine/auth/100/server.key
#QSUNSHINE_AUTH_TICKET_KEY=/etc/q-sunshine/auth/100/ticket.key
#QSUNSHINE_AUTH_AUDIENCE=vm-100
#QSUNSHINE_AUTH_ALLOWED_USERS=alice,bob
#QSUNSHINE_AUTH_PAM_SERVICE=q-sunshine-remote
#QSUNSHINE_AUTH_GATEWAY_HOST=127.0.0.1
#QSUNSHINE_AUTH_GATEWAY_PORT=48123
#QSUNSHINE_AUTH_TICKET_TTL_SECONDS=600
#QSUNSHINE_AUTH_MAX_CONCURRENT_REQUESTS=16
# Optional prepared native GameStream certificate lease authority. All five
# values are mandatory together; leave every one unset to disable its endpoint.
# With the packaged patched Sunshine and the trusted patched macOS Moonlight
# client, this enables PIN-free native media. Stock Moonlight cannot consume
# this lease and must fail rather than silently retain legacy pairing. See
# installed GAMESTREAM_LEASE_AUTH.md before provisioning it.
#QSUNSHINE_GAMESTREAM_LEASE_ISSUER=/usr/lib/q-sunshine/bin/q-sunshine-lease-issuer
#QSUNSHINE_GAMESTREAM_LEASE_CA_CERT=/etc/q-sunshine/auth/100/gamestream-ca.crt
#QSUNSHINE_GAMESTREAM_LEASE_CA_KEY=/etc/q-sunshine/auth/100/gamestream-ca.key
# q-sunshine@100 creates its default Sunshine leaf here on its first
# successful start (XDG_CONFIG_HOME=/var/lib/q-sunshine/100).  Start and
# verify q-sunshine@100 before starting q-sunshine-auth@100, or point this at
# an explicitly provisioned Sunshine cert path instead.
#QSUNSHINE_GAMESTREAM_LEASE_SUNSHINE_SERVER_CERT=/var/lib/q-sunshine/100/sunshine/credentials/cacert.pem
#QSUNSHINE_GAMESTREAM_LEASE_TTL_SECONDS=300
# When those are complete, /usr/bin/q-sunshine automatically passes
# qsm_system_auth_mode=enabled plus the same CA and QSUNSHINE_AUTH_AUDIENCE to
# the patched Sunshine process; it rejects partial lease config rather than
# retaining PIN/pairing fallback.
#
# Enable q-sunshine-qsf-system-auth-gateway@<VMID> (not the legacy
# q-sunshine-qsf-gateway@<VMID>) to use short-lived system tickets instead of
# QSUNSHINE_QSF_CLIENT_CA mTLS. QSF remains a separate clipboard/file/resize
# companion; native GameStream admission is the lease configuration above.
# The two remote QSF gateway units conflict intentionally: enable only one
# per VM, since both default to the same listener/port.
