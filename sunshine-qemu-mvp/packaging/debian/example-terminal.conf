# Root-only node-level terminal broker configuration. Copy to
# /etc/q-sunshine/terminal.conf with mode 0600. The normal browser workflow
# does not expose any of these fields to users: PVE's protected VM.Console
# route sends the selected VM to this service over a root-only Unix socket.

# Reuse the PVE proxy certificate/CA or deliberately provision a matching
# protected TLS identity. The descriptor carries the public CA only, while the
# key and the raw 32-byte ticket key remain root-readable on the node.
QSUNSHINE_TERMINAL_SERVER_CERT=/etc/pve/local/pve-ssl.pem
QSUNSHINE_TERMINAL_SERVER_KEY=/etc/pve/local/pve-ssl.key
QSUNSHINE_TERMINAL_DESCRIPTOR_CA_FILE=/etc/pve/pve-root-ca.pem
QSUNSHINE_TERMINAL_TICKET_KEY=/etc/q-sunshine/terminal/ticket.key

# The shared root-owned map is authoritative for every descriptor this broker
# issues. The browser never receives the map or chooses an endpoint. Its exact
# v1 schema is documented beside this file and is public metadata only.
QSUNSHINE_TERMINAL_NODE_ENDPOINTS_FILE=/etc/pve/q-sunshine-node-endpoints.json

# The endpoint map above is mandatory and authoritative, including its
# advertised connect host and TLS server_name. No hostname fallback is derived
# from a browser request or from this service configuration.
QSUNSHINE_TERMINAL_LISTEN_HOST=0.0.0.0
QSUNSHINE_TERMINAL_LISTEN_PORT=48123

# The media and QSF transport workers use their ports from each root-owned
# /etc/q-sunshine/instances.d/<VMID>.conf. Choose a protected address which
# native clients can reach; it is never supplied by a browser request.
QSUNSHINE_TERMINAL_TRANSPORT_BIND_HOST=0.0.0.0
QSUNSHINE_TERMINAL_LOCAL_NODE=pve
QSUNSHINE_TERMINAL_VM_RUNTIME_DIRECTORY=/run/q-sunshine

# Optional bounded service values; retain defaults unless capacity testing
# establishes a reason to change them.
#QSUNSHINE_TERMINAL_TICKET_TTL_SECONDS=600
#QSUNSHINE_TERMINAL_DESCRIPTOR_TTL_SECONDS=60
#QSUNSHINE_TERMINAL_MAX_CONCURRENT_REQUESTS=16
