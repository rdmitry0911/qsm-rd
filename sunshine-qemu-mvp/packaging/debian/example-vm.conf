# Root-only VM transport policy. Copy to
# /etc/q-sunshine/instances.d/<VMID>.conf with mode 0600. This file contains
# no user credentials: PVE Web UI validates the user and VM.Console ACL before
# the node-level q-sunshine-terminal service reads it.
#
# Before starting this VM, add an equivalent root-reviewed PVE `args:` value
# to /etc/pve/qemu-server/100.conf (adapt only VMID/render node):
#
# args: -device virtio-vga-gl -display dbus,addr=unix:path=/run/q-sunshine/100/qemu-display1.bus,gl=on,rendernode=/dev/dri/renderD128 -chardev socket,id=qsfagent,path=/run/q-sunshine/100/qsf-agent.sock,server=on,wait=off -device virtserialport,chardev=qsfagent,name=org.q-sunshine.qsf
#
# q-sunshine-terminal creates and owns the private D-Bus daemon before
# pve-guests starts QEMU. Do not substitute a host DBUS_SESSION_BUS_ADDRESS or
# reuse either socket with another VM.

SUNSHINE_QEMU_DBUS_ADDRESS=unix:path=/run/q-sunshine/100/qemu-display1.bus
SUNSHINE_QEMU_DBUS_DESTINATION=org.qemu
SUNSHINE_QEMU_DBUS_RENDER_NODE=/dev/dri/renderD128

# Every VM requires unique externally reachable transport ports on its node.
# The broker returns these only after a one-use PVE .qsm claim is redeemed.
QSUNSHINE_MEDIA_PORT=47989
QSUNSHINE_QSF_PORT=48122
QSUNSHINE_QSF_AGENT_SOCKET=/run/q-sunshine/100/qsf-agent.sock
# Optional explicit host for a VM with a different reachable address than the
# node endpoint selected from the shared terminal node map.
#QSUNSHINE_ADVERTISE_HOST=pve.example.invalid
#QSUNSHINE_PVE_NODE=pve

# Leave unset for Sunshine's own real encoder probe, or set after validation:
#QSUNSHINE_ENCODER=nvenc

# Tested host encoder envelope for QSF optimum profile negotiation.  The
# primary browser transport validates its own selected encoder rather than
# asking Sunshine: auto attempts NVENC, Intel QSV, VAAPI (Intel/AMD), then
# libx264.  A failed accelerator falls through; an explicit policy fails
# closed, which is useful for a homogeneous production pool.
#QSUNSHINE_QSF_ENCODER_PROBE=direct
#QSUNSHINE_DIRECT_ENCODER=auto
#QSUNSHINE_DIRECT_VAAPI_RENDER_NODE=/dev/dri/renderD128
#QSUNSHINE_QSF_HOST_MAX_WIDTH=3840
#QSUNSHINE_QSF_HOST_MAX_HEIGHT=2160
#QSUNSHINE_QSF_HOST_MAX_FPS=60
#QSUNSHINE_QSF_HOST_MAX_BITRATE_KBPS=45000
#QSUNSHINE_QSF_HOST_ENCODER_CODECS=H264,HEVC,AV1
# Compatibility-only native GameStream diagnostics may opt into its old
# endpoint probe explicitly; the direct browser path never calls it.
#QSUNSHINE_QSF_ENCODER_PROBE=sunshine_compat
#QSUNSHINE_QSF_SUNSHINE_SERVERINFO_URL=http://127.0.0.1:47990/serverinfo

# Native PIN-free GameStream lease authority. Run
# `q-sunshine-provision-vm 100` before copying these values: all six values
# are mandatory and q-sunshine-terminal starts no worker if one is absent.
# The pre-provisioned server certificate/key remove Sunshine's first-run
# auto-generated-pairing race. The root-only issuer signs a client-owned CSR
# only after a current VM-scoped qsa ticket from a redeemed PVE launch claim;
# it never sees a user password or a client private key.
QSUNSHINE_GAMESTREAM_LEASE_ISSUER=/usr/lib/q-sunshine/bin/q-sunshine-lease-issuer
QSUNSHINE_GAMESTREAM_LEASE_CA_CERT=/etc/q-sunshine/vms/100/gamestream-ca.crt
QSUNSHINE_GAMESTREAM_LEASE_CA_KEY=/etc/q-sunshine/vms/100/gamestream-ca.key
QSUNSHINE_GAMESTREAM_LEASE_SUNSHINE_SERVER_CERT=/etc/q-sunshine/vms/100/sunshine-server.crt
QSUNSHINE_GAMESTREAM_LEASE_SUNSHINE_SERVER_KEY=/etc/q-sunshine/vms/100/sunshine-server.key
QSUNSHINE_GAMESTREAM_LEASE_TTL_SECONDS=300
