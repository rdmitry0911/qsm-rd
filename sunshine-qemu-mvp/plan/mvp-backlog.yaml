project: sunshine-qemu-desktop
version: '0.4'
principles:
- one_sunshine_worker_per_vm
- private_dbus_per_vm
- latest_frame_wins
- cpu_first_functional_gate
- no_full_frame_cpu_readback_on_fast_path
- stock_moonlight_before_client_extensions
- evidence_before_acceptance
milestones:
- id: M0
  name: dbus_probe
  exit_gate: QEMU display/input/audio lifecycle proven outside Sunshine
- id: M1
  name: cpu_vertical_slice
  exit_gate: stock Moonlight receives VM video/input/audio using shared-map fallback
- id: M2
  name: gpu_fast_path
  exit_gate: DMA-BUF reaches native encoder without full-frame CPU readback
- id: M3
  name: operational_mvp0
  exit_gate: per-VM service, reconnect, soak, latency and isolation gates pass
- id: M4
  name: desktop_mvp1
  exit_gate: live resize, text clipboard and local cursor pass compatibility gates
tasks:
- id: ENV-001
  milestone: M0
  title: Pin reproducible host stack
  depends_on: []
  effort_points: 2
  outputs:
  - versions.lock
  - host_inventory.json
  - two reference guest definitions
  acceptance:
  - QEMU boots Linux and Windows guests with CPU-visible virtio-vga
  - no GPU or render node is required for M0/M1
  - a separate virtio-vga-gl profile records the GPU lane for M2
  status: blocked_external
  status_note: Needs a real QEMU host and reference guests.
- id: DBUS-001
  milestone: M0
  title: Build private per-VM D-Bus launcher
  depends_on:
  - ENV-001
  effort_points: 3
  outputs:
  - private bus launcher
  - address file with restricted permissions
  - reconnect test
  acceptance:
  - bus is Unix-only and inaccessible to unrelated users
  - QEMU owns the expected Display1 objects
  status: prototype_complete
  status_note: Private/session-bus launch scripts exist; production systemd isolation remains.
- id: DBUS-002
  milestone: M0
  title: Implement display listener probe
  depends_on:
  - DBUS-001
  effort_points: 5
  outputs:
  - qemu-display-probe
  - ScanoutDMABUF metadata log
  - cursor dump
  - surface lifetime tests
  acceptance:
  - 30-minute run has no FD or RSS growth
  - mode switch produces a new tracked surface generation
  status: implemented_mock_validated
  status_note: Real listener, inline/map frames, cursor and lifecycle pass in-process and cross-process tests; real
    QEMU soak pending.
  evidence:
  - qmdp_dbus_integration_tests
  - qmdp_message_bus_map_e2e
  - qmdp_message_bus_inline_e2e
  - tools/qemu_display_probe.cpp
- id: INPUT-001
  milestone: M0
  title: Implement QEMU keyboard and mouse adapter
  depends_on:
  - DBUS-001
  effort_points: 5
  outputs:
  - tested key map
  - absolute and relative mouse paths
  - release-all logic
  acceptance:
  - input works in UEFI, Linux TTY and Windows login
  - host desktop receives no injected events
  status: implemented_mock_validated
  status_note: Keyboard, absolute/relative pointer and buttons pass cross-process D-Bus smoke; UEFI/Linux/Windows
    validation pending.
  evidence:
  - qmdp_message_bus_map_e2e keyboard=2 mouse=4
  - tools/qemu_display_probe.cpp --input-smoke
- id: AUDIO-001
  milestone: M0
  title: Implement QEMU AudioOut receiver
  depends_on:
  - DBUS-001
  effort_points: 5
  outputs:
  - PCM format negotiation
  - float32 conversion
  - bounded FIFO telemetry
  acceptance:
  - stereo 48-kHz audio is isolated per VM
  - overflow drops oldest samples
  status: implemented_mock_validated
  status_note: AudioOut lifecycle, PCM conversion and bounded delivery pass integration test; real-QEMU isolation
    pending.
  evidence:
  - qmdp_dbus_integration_tests audio writes/frames
  - src/qemu/qemu_dbus_display.cpp AudioOutListener
- id: SUN-001
  milestone: M1
  title: Add qemu_dbus source to Sunshine Linux capture factory
  depends_on:
  - DBUS-002
  effort_points: 5
  outputs:
  - qemu_display_t
  - source configuration
  - lifecycle and reconnect logging
  acceptance:
  - Sunshine receives frame tokens from QEMU
  - D-Bus callback never waits for encoder
  status: ready_to_start
  status_note: Sunshine CPU backend contract and patch series are written; upstream tree is not patched yet.
  evidence:
  - integration/sunshine/CPU_BACKEND_CONTRACT.md
  - integration/sunshine/PATCH_SERIES.md
- id: SUN-002
  milestone: M1
  title: Complete CPU/shared-map vertical slice
  depends_on:
  - SUN-001
  - INPUT-001
  - AUDIO-001
  effort_points: 5
  outputs:
  - stock Moonlight stream
  - input and audio integration
  - baseline latency report
  acceptance:
  - UEFI through desktop remains visible in one session
  - guest reboot recovers without re-pairing
  status: diagnostic_vertical_slice_complete
  status_note: FFmpeg/libx264 proves no-GPU encoding; stock Moonlight via Sunshine remains pending.
  evidence:
  - qmdp_no_gpu_ffmpeg_selftest
  - src/software/ffmpeg_software_adapter.cpp
- id: GPU-001
  milestone: M2
  title: Import QEMU DMA-BUF into Sunshine EGL descriptor
  depends_on:
  - SUN-002
  effort_points: 8
  outputs:
  - single-plane RGB import
  - modifier allowlist/fallback
  - RAII FD ownership proof
  acceptance:
  - no full-frame CPU readback in profiler trace
  - unsupported modifier fails or blits cleanly without crash
  status: not_started
  status_note: Optimization deferred until software path is streaming through Sunshine.
- id: GPU-002
  milestone: M2
  title: Reuse native Sunshine conversion and encoder path
  depends_on:
  - GPU-001
  effort_points: 8
  outputs:
  - VAAPI or CUDA/Vulkan path
  - frame timing instrumentation
  - IDR on surface generation change
  acceptance:
  - 1080p60 host capture-convert-encode p95 <= 12 ms
  - capture queue depth never exceeds one
  status: not_started
  status_note: Optimization deferred until software path is streaming through Sunshine.
- id: RES-001
  milestone: M2
  title: Match guest geometry at stream start
  depends_on:
  - SUN-002
  effort_points: 3
  outputs:
  - SetUIInfo call from launch mode
  - scaling fallback
  acceptance:
  - 1080p and 1440p requests either apply or report deterministic fallback
  status: adapter_mock_validated
  status_note: SetUIInfo is implemented and observed cross-process; real guest mode change pending.
  evidence:
  - qmdp_message_bus_map_e2e requested=320x180
- id: OPS-001
  milestone: M3
  title: Package one worker per VM
  depends_on:
  - GPU-002
  - RES-001
  effort_points: 5
  outputs:
  - systemd templates
  - per-VM ports/config/certs
  - readiness and watchdog
  acceptance:
  - one VM failure does not affect another
  - host reboot restores configured endpoints
  status: not_started
  status_note: Configuration model exists; production systemd templates and supervisor pending.
- id: QA-001
  milestone: M3
  title: Run soak, reconnect and failure matrix
  depends_on:
  - OPS-001
  effort_points: 8
  outputs:
  - p50/p95/p99 report
  - 8-hour soak report
  - 100-reconnect FD/RSS report
  - input-to-photon measurement
  acceptance:
  - every mandatory gate in docs/MVP_ACCEPTANCE.md passes
  status: partial
  status_note: Release and ASan/UBSan tests pass; real 8-hour/100-reconnect/latency evidence pending.
  evidence:
  - release CTest matrix
  - ASan+UBSan CTest matrix
- id: CLI-001
  milestone: M4
  title: Add authenticated QMDP client to Moonlight-Qt
  depends_on:
  - QA-001
  effort_points: 8
  outputs:
  - capabilities handshake
  - session binding
  - fallback to ordinary Moonlight
  acceptance:
  - absence or version mismatch of QMDP never breaks base streaming
  status: not_started
  status_note: Host stock-Moonlight path is a prerequisite.
- id: CLI-002
  milestone: M4
  title: Implement live viewport resize
  depends_on:
  - CLI-001
  effort_points: 5
  outputs:
  - Qt viewport tracker
  - 250-ms debounce
  - stale ACK suppression
  acceptance:
  - 100 resize cycles pass with zero crashes and at most one black frame
  status: not_started
  status_note: Host stock-Moonlight path is a prerequisite.
- id: CLI-003
  milestone: M4
  title: Implement text clipboard
  depends_on:
  - CLI-001
  effort_points: 5
  outputs:
  - offer/request/data flow
  - QEMU clipboard bridge
  - permissions and loop suppression
  acceptance:
  - bidirectional UTF-8 text up to 1 MiB
  - 1000-event loop test produces no echo storm
  status: not_started
  status_note: Host stock-Moonlight path is a prerequisite.
- id: CLI-004
  milestone: M4
  title: Implement local cursor
  depends_on:
  - CLI-001
  effort_points: 5
  outputs:
  - cursor define/move/visible messages
  - client-side cursor renderer
  - baked-cursor fallback
  acceptance:
  - no double cursor during capability transition
  status: not_started
  status_note: Host stock-Moonlight path is a prerequisite.
status_date: '2026-08-31'
current_phase: MVP-0A complete in standalone repository; Sunshine software-backend integration next
