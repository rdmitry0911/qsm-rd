# The blank directives reset only the corresponding vendor commands; all
# other pvedaemon.service hardening and dependencies remain intact.
[Service]
ExecStart=
ExecStart=/usr/lib/q-sunshine/pve9-api/q-sunshine-pvedaemon start
ExecStop=
ExecStop=/usr/lib/q-sunshine/pve9-api/q-sunshine-pvedaemon stop
ExecReload=
ExecReload=/usr/lib/q-sunshine/pve9-api/q-sunshine-pvedaemon restart
