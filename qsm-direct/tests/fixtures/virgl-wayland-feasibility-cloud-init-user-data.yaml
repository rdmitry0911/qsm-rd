#cloud-config
#
# A deliberately small, guest-only feasibility gate. It proves whether the
# pinned Alpine image can run Weston on virtio-gpu DRM and use its real Wayland
# clipboard. The host starts no desktop service.
write_files:
  - path: /usr/local/sbin/virgl-wayland-feasibility
    permissions: '0700'
    content: |
      #!/bin/sh
      set -u

      serial=/dev/ttyS0
      telemetry=/dev/virtio-ports/org.qsmdirect.wayland.telemetry
      runtime=/run/user/0
      weston_log=/tmp/virgl-wayland-weston.log
      clipboard_in=/tmp/virgl-wayland-clipboard-in.txt
      clipboard_out=/tmp/virgl-wayland-clipboard-out.txt
      weston_pid=''
      seatd_pid=''

      report() {
        printf '%s\n' "$*" >"$serial" 2>/dev/null || true
        if [ -c "$telemetry" ]; then
          printf '%s\n' "$*" >"$telemetry" 2>/dev/null || true
        fi
      }

      stop_weston() {
        if [ -n "$weston_pid" ] && kill -0 "$weston_pid" 2>/dev/null; then
          kill "$weston_pid" 2>/dev/null || true
          wait "$weston_pid" 2>/dev/null || true
        fi
      }

      stop_seatd() {
        if [ -n "$seatd_pid" ] && kill -0 "$seatd_pid" 2>/dev/null; then
          kill "$seatd_pid" 2>/dev/null || true
          wait "$seatd_pid" 2>/dev/null || true
        fi
      }

      fail() {
        report "VIRGL_WAYLAND_FEASIBILITY_FAILED=$*"
        if [ -f "$weston_log" ]; then
          sed -n '1,180p' "$weston_log" >"$serial" 2>/dev/null || true
        fi
        for detail_log in /tmp/virgl-wayland-wl-copy.log /tmp/virgl-wayland-wl-paste.log \
            /tmp/virgl-wayland-seatd.log; do
          if [ -f "$detail_log" ]; then
            printf '%s\n' "--- $detail_log ---" >"$serial" 2>/dev/null || true
            sed -n '1,120p' "$detail_log" >"$serial" 2>/dev/null || true
          fi
        done
        stop_weston
        stop_seatd
        sync
        exit 1
      }

      report VIRGL_WAYLAND_FEASIBILITY
      report "kernel=$(uname -srmo)"
      mkdir -p "$runtime" || fail cannot_create_xdg_runtime_dir
      chmod 700 "$runtime" || fail cannot_protect_xdg_runtime_dir
      export XDG_RUNTIME_DIR="$runtime"
      export WAYLAND_DISPLAY=wayland-0

      if ! grep -Fqx 'https://dl-cdn.alpinelinux.org/alpine/v3.20/community' \
          /etc/apk/repositories; then
        printf '%s\n' 'https://dl-cdn.alpinelinux.org/alpine/v3.20/community' \
          >>/etc/apk/repositories || fail cannot_enable_alpine_community
      fi
      apk add --no-cache mesa-dri-gallium mesa-egl mesa-utils \
        weston weston-backend-drm weston-shell-desktop weston-clients wl-clipboard seatd eudev \
        >/tmp/virgl-wayland-apk.log 2>&1 || {
          sed -n '1,180p' /tmp/virgl-wayland-apk.log >"$serial" 2>/dev/null || true
          fail cannot_install_wayland_packages
        }
      record_wayland_package_version() {
        package=$1
        installed=$(awk -v package="$package" '
          $0 == "P:" package { selected = 1; next }
          selected && /^V:/ { sub(/^V:/, ""); print; exit }
          /^P:/ { selected = 0 }
        ' /lib/apk/db/installed)
        [ -n "$installed" ] || fail "installed_wayland_package_version_missing_$package"
        report "guest_wayland_package_${package}=${package}-${installed}"
      }
      for package in mesa-dri-gallium mesa-egl mesa-utils \
          weston weston-backend-drm weston-shell-desktop weston-clients \
          wl-clipboard seatd eudev; do
        record_wayland_package_version "$package"
      done

      test -c /dev/dri/card0 || fail guest_card0_missing
      test -c /dev/dri/renderD128 || fail guest_renderD128_missing
      driver_node=$(find /sys/bus/virtio/drivers/virtio_gpu -mindepth 1 \
        -maxdepth 1 -type l 2>/dev/null | head -n1)
      test -n "$driver_node" || fail virtio_gpu_not_bound
      report 'guest_drm_driver=virtio_gpu'
      EGL_PLATFORM=surfaceless eglinfo -B >/tmp/virgl-wayland-eglinfo.log 2>&1 || true
      renderer=$(sed -n 's/^OpenGL core profile renderer: //p' \
        /tmp/virgl-wayland-eglinfo.log | head -n1)
      report "guest_gl_renderer=$renderer"
      printf '%s' "$renderer" | grep -qi virgl || fail "expected_virgl_renderer_got_$renderer"

      # The generic cloud image deliberately does not boot a udev daemon.
      # libinput ignores the QEMU virtio HID devices until their ID_INPUT
      # properties are materialized, which would leave Weston without wl_seat.
      udevd --daemon >/tmp/virgl-wayland-udevd.log 2>&1 || fail udevd_failed_to_start
      for _ in $(seq 1 100); do
        test -S /run/udev/control && break
        sleep 0.1
      done
      test -S /run/udev/control || fail udevd_control_socket_not_created
      udevadm trigger --action=add --subsystem-match=input \
        >/tmp/virgl-wayland-udev-trigger.log 2>&1 || fail udev_input_trigger_failed
      udevadm settle --timeout=10 >/tmp/virgl-wayland-udev-settle.log 2>&1 \
        || fail udev_input_settle_failed
      input_device=''
      for event in /dev/input/event*; do
        test -c "$event" || continue
        if udevadm info --query=property --name="$event" 2>/dev/null | grep -Fqx 'ID_INPUT=1'; then
          input_device=$event
          break
        fi
      done
      test -n "$input_device" || fail udev_did_not_tag_qemu_input
      report "guest_wayland_input=$input_device"

      # This cloud image has neither logind nor an interactive login session.
      # Weston DRM therefore needs the lightweight guest-local libseat server.
      rm -f /run/seatd.sock
      seatd -n -g root >/tmp/virgl-wayland-seatd.log 2>&1 &
      seatd_pid=$!
      for _ in $(seq 1 100); do
        test -S /run/seatd.sock && break
        kill -0 "$seatd_pid" 2>/dev/null || break
        sleep 0.1
      done
      test -S /run/seatd.sock || fail seatd_socket_not_created
      kill -0 "$seatd_pid" 2>/dev/null || fail seatd_exited_before_weston
      report 'guest_wayland_seat=seatd'

      rm -f "$runtime/wayland-0" "$weston_log"
      weston --backend=drm-backend.so --socket=wayland-0 \
        --log="$weston_log" --idle-time=0 --no-config --continue-without-input \
        >"$serial" 2>&1 &
      weston_pid=$!
      for _ in $(seq 1 450); do
        test -S "$runtime/wayland-0" && break
        kill -0 "$weston_pid" 2>/dev/null || break
        sleep 0.1
      done
      test -S "$runtime/wayland-0" || fail weston_drm_socket_not_created
      kill -0 "$weston_pid" 2>/dev/null || fail weston_drm_exited_after_socket
      grep -qiE 'drm-backend|drm output|using.*drm' "$weston_log" \
        || fail weston_log_does_not_confirm_drm_backend
      report 'guest_wayland_compositor=weston-drm'

      # Files make this bytewise: it catches loss of Unicode/newlines and
      # verifies a real Wayland selection round trip.
      printf '%s\n' 'guest-wayland-clipboard: Привет ✓' >"$clipboard_in"
      if ! wl-copy --type 'text/plain;charset=utf-8' <"$clipboard_in" \
          >/tmp/virgl-wayland-wl-copy.log 2>&1; then
        copy_error=$(tr '\n' ' ' </tmp/virgl-wayland-wl-copy.log | head -c 300)
        report "guest_wayland_wl_copy_stderr=$copy_error"
        fail wl_copy_failed
      fi
      copied=0
      for _ in $(seq 1 100); do
        if wl-paste --no-newline >"$clipboard_out" \
            2>/tmp/virgl-wayland-wl-paste.log && cmp -s "$clipboard_in" "$clipboard_out"; then
          copied=1
          break
        fi
        sleep 0.1
      done
      [ "$copied" = 1 ] || fail wl_paste_did_not_observe_real_wayland_selection
      report "guest_wayland_clipboard_sha256=$(sha256sum "$clipboard_out" | awk '{print $1}')"
      report VIRGL_WAYLAND_FEASIBILITY_OK
      stop_weston
      stop_seatd
      sync

runcmd:
  - [ /usr/local/sbin/virgl-wayland-feasibility ]
