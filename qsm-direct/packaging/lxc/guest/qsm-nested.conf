# QSM Direct container console: KWin runs nested inside the console's
# headless display (QSM_OUTER_DISPLAY is set by qsm-session-launch).
[Service]
# The headless display has no DRM backend device, so Xwayland's glamor would
# fall back to wl_drm with a format KWin rejects (fatal protocol error that
# kills Xwayland and every X11 client).  X11 clients therefore use SHM; KWin
# and native Wayland clients keep rendering on the GPU.
Environment=XWAYLAND_NO_GLAMOR=1
ExecStart=
ExecStart=/usr/bin/kwin_wayland_wrapper --xwayland --wayland-display ${QSM_OUTER_DISPLAY} --width 1920 --height 1080
