# QSM Direct container console: headless "virtual monitor" hosting the session.
# The console resizes this output to the browser window at connect time.
output HEADLESS-1 mode 1920x1080 position 0 0 bg #000000 solid_color
default_border none
default_floating_border none
gaps inner 0
focus_follows_mouse no
# The single session window (nested KWin, or the rootful Xwayland of an X11
# session) always covers the whole output.
for_window [app_id=".*"] fullscreen enable
for_window [class=".*"] fullscreen enable
seat seat0 xcursor_theme breeze_cursors 24
